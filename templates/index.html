<!DOCTYPE html>
<html>
<head>
    <title>My Flask App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-center p-10">
    <h1 class="text-4xl font-bold text-blue-600">Welcome to My Flask App 🚀</h1>
    <p class="mt-4 text-lg">This is my custom homepage instead of "Hello from Flask!"</p>
    <form action="/submit" method="post" class="mt-6">
        <input type="text" name="username" placeholder="Enter your name" class="border p-2 rounded">
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Submit</button>
    </form>
</body>
</html>
